<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 630">
  <title id="title">Timeline of valid mobile observations and excluded Wi-Fi measurements</title>
  <desc id="desc">The timeline marks pre-drill measurements at 13:50, 14:16 and 14:25; the official 14:30 to 15:00 window; excluded fixed-line measurements at 14:35; a valid mobile Tor test at 14:53; and post measurements from 15:08 to 15:23.</desc>
  <rect width="1200" height="630" fill="#f7fbfa"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#163834">
    <text x="72" y="76" font-size="38" font-weight="700">Observation timeline</text>
    <text x="72" y="116" font-size="22" fill="#496b66">Asia/Taipei · valid AS24158 measurements and one excluded AS3462 interval</text>
    <rect x="533" y="186" width="238" height="250" fill="#f5dfbf" opacity="0.72"/>
    <text x="652" y="172" text-anchor="middle" font-size="19" font-weight="700" fill="#9b5a13">Official drill 14:30–15:00</text>
    <line x1="110" y1="330" x2="1090" y2="330" stroke="#55746f" stroke-width="3"/>
    <g stroke="#55746f" stroke-width="2" fill="none">
      <line x1="110" y1="316" x2="110" y2="344"/><line x1="348" y1="316" x2="348" y2="344"/>
      <line x1="586" y1="316" x2="586" y2="344"/><line x1="824" y1="316" x2="824" y2="344"/>
      <line x1="1062" y1="316" x2="1062" y2="344"/>
    </g>
    <g font-size="18" text-anchor="middle" fill="#496b66">
      <text x="110" y="375">13:40</text><text x="348" y="375">14:10</text><text x="586" y="375">14:40</text>
      <text x="824" y="375">15:10</text><text x="1062" y="375">15:40</text>
    </g>
    <g fill="#168c80" stroke="#0e665e" stroke-width="2">
      <circle cx="189" cy="330" r="12"/><circle cx="396" cy="330" r="12"/><circle cx="467" cy="330" r="12"/>
      <circle cx="689" cy="330" r="12"/><circle cx="813" cy="330" r="12"/><circle cx="866" cy="330" r="12"/>
      <circle cx="895" cy="330" r="12"/><circle cx="919" cy="330" r="12"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="189" y="292">Snowflake</text><text x="189" y="270">13:50</text>
      <text x="396" y="414">NDT + DASH</text><text x="396" y="436">14:16</text>
      <text x="467" y="292">Tor</text><text x="467" y="270">14:25</text>
      <text x="689" y="414">Tor</text><text x="689" y="436">14:53</text>
      <text x="813" y="292">NDT</text><text x="813" y="270">15:08</text>
      <text x="866" y="414">DASH</text><text x="866" y="436">15:10</text>
      <text x="895" y="292">Tor</text><text x="895" y="270">15:15</text>
      <text x="944" y="414">SF + Tor</text><text x="944" y="436">15:18–15:23</text>
    </g>
    <g stroke="#a64a43" stroke-width="5">
      <line x1="546" y1="305" x2="578" y2="337"/><line x1="578" y1="305" x2="546" y2="337"/>
    </g>
    <text x="562" y="472" text-anchor="middle" font-size="17" fill="#8f3e38">14:35 NDT/DASH excluded</text>
    <text x="562" y="494" text-anchor="middle" font-size="17" fill="#8f3e38">AS3462 fixed-line Wi-Fi</text>
    <g font-size="18" fill="#496b66">
      <circle cx="96" cy="550" r="9" fill="#168c80"/><text x="116" y="556">Included mobile observation (AS24158)</text>
      <line x1="485" y1="540" x2="505" y2="560" stroke="#a64a43" stroke-width="4"/><line x1="505" y1="540" x2="485" y2="560" stroke="#a64a43" stroke-width="4"/>
      <text x="520" y="556">Excluded from mobile analysis</text>
    </g>
  </g>
</svg>
