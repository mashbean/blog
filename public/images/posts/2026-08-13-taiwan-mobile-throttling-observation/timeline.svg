<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 700">
  <title id="title">Timeline of valid mobile observations and the recovery interval</title>
  <desc id="desc">The official drill ran from 14:30 to 15:00. Valid mobile tests showed impairment through 15:12 and functional performance at 17:47. Recovery occurred between those observations.</desc>
  <rect width="1200" height="700" fill="#f7fbfa"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#163834">
    <text x="72" y="76" font-size="38" font-weight="700">Observation and recovery timeline</text>
    <text x="72" y="116" font-size="22" fill="#496b66">Taipei · Asia/Taipei · valid AS24158 mobile measurements</text>
    <rect x="305" y="190" width="99" height="250" fill="#f5dfbf" opacity="0.8"/>
    <text x="354" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#9b5a13">Drill 14:30–15:00</text>
    <rect x="446" y="190" width="516" height="250" fill="#dfe8f6" opacity="0.8"/>
    <text x="704" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#405d99">Recovery occurred within this interval</text>
    <line x1="110" y1="330" x2="1090" y2="330" stroke="#55746f" stroke-width="3"/>
    <g stroke="#55746f" stroke-width="2">
      <line x1="110" y1="316" x2="110" y2="344"/><line x1="305" y1="316" x2="305" y2="344"/>
      <line x1="404" y1="316" x2="404" y2="344"/><line x1="601" y1="316" x2="601" y2="344"/>
      <line x1="798" y1="316" x2="798" y2="344"/><line x1="995" y1="316" x2="995" y2="344"/>
    </g>
    <g font-size="17" text-anchor="middle" fill="#496b66">
      <text x="110" y="372">13:30</text><text x="305" y="372">14:30</text><text x="404" y="372">15:00</text>
      <text x="601" y="372">16:00</text><text x="798" y="372">17:00</text><text x="995" y="372">18:00</text>
    </g>
    <g fill="#168c80" stroke="#0e665e" stroke-width="2">
      <circle cx="176" cy="330" r="11"/><circle cx="260" cy="330" r="11"/><circle cx="381" cy="330" r="11"/>
      <circle cx="980" cy="330" r="12"/>
    </g>
    <g fill="#d88a2c" stroke="#9b5a13" stroke-width="2">
      <circle cx="433" cy="330" r="12"/><circle cx="440" cy="330" r="12"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="176" y="285">Snowflake</text><text x="176" y="263">13:50</text>
      <text x="260" y="410">NDT + DASH</text><text x="260" y="432">14:16</text>
      <text x="381" y="285">Tor</text><text x="381" y="263">14:53</text>
      <text x="430" y="410">NDT 15:08</text><text x="430" y="432">DASH through 15:12</text>
      <text x="980" y="285">Complete retest</text><text x="980" y="263">17:47–17:49</text>
    </g>
    <g stroke="#a64a43" stroke-width="5">
      <line x1="304" y1="300" x2="332" y2="328"/><line x1="332" y1="300" x2="304" y2="328"/>
    </g>
    <text x="318" y="470" text-anchor="middle" font-size="17" fill="#8f3e38">No valid mobile NDT/DASH at 14:35</text>
    <g font-size="18" fill="#496b66">
      <circle cx="94" cy="585" r="9" fill="#168c80"/><text x="114" y="591">Completed mobile observation</text>
      <circle cx="405" cy="585" r="9" fill="#d88a2c"/><text x="425" y="591">Clearly impaired performance</text>
      <rect x="730" y="574" width="24" height="18" fill="#dfe8f6"/><text x="765" y="591">Recovery time remains unresolved</text>
    </g>
    <text x="72" y="654" font-size="18" fill="#5d7773">Last impaired result ended 15:12:48; first recovered result began 17:47:30.</text>
  </g>
</svg>
