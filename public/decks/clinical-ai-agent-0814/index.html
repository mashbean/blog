<style>
:root{
  --night:#07101f;--night2:#0b1730;--panel:#0d1c37e8;--ink:#f6f8ff;--muted:#aab8d5;
  --cyan:#35dcff;--pink:#ff4f9a;--violet:#8b5cf6;--lime:#b9f24a;--yellow:#ffd84d;--line:#2a4168;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:var(--ink);font-family:'Noto Sans TC',sans-serif}
.deck-shell{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,1fr);width:100%;height:100dvh;background:#020611;transition:grid-template-columns .28s cubic-bezier(.2,.8,.2,1)}
.deck-pane{position:relative;min-width:0;min-height:0;overflow:hidden}
deck-stage{position:absolute;inset:0;display:block;width:100%;height:100%}
.dashboard-pane{min-width:0;min-height:0;overflow:hidden;border-left:1px solid #2a4168;background:#081225;transition:opacity .2s ease,border-color .2s ease}
.dashboard-pane iframe{display:block;width:100%;height:100%;border:0;background:#081225;pointer-events:auto;touch-action:pan-y}
.dashboard-toggle,.dashboard-scrim,.dashboard-drawer-bar{display:none}
.dashboard-collapse{position:fixed;right:calc(25% - 18px);top:50%;z-index:38;display:grid;place-items:center;width:36px;height:72px;transform:translateY(-50%);border:1px solid #45628f;border-right:0;border-radius:18px 0 0 18px;background:#081225ed;color:var(--cyan);font:900 24px/1 'Noto Sans TC',sans-serif;box-shadow:-10px 0 28px #0206128f;cursor:pointer;touch-action:manipulation;transition:right .28s cubic-bezier(.2,.8,.2,1),background .2s ease}
.dashboard-collapse:hover{background:#102245}
body.dashboard-collapsed .deck-shell{grid-template-columns:minmax(0,1fr) 0}
body.dashboard-collapsed .dashboard-pane{opacity:0;pointer-events:none;border-left-color:transparent}
body.dashboard-collapsed .dashboard-collapse{display:none}
body.dashboard-collapsed .dashboard-toggle{position:fixed;right:14px;top:14px;z-index:42;display:flex;align-items:center;gap:8px;border:1px solid #35dcff88;border-radius:999px;padding:10px 14px;background:#081225ed;color:var(--cyan);font:800 13px/1 'Noto Sans TC',sans-serif;box-shadow:0 12px 34px #020612b8;backdrop-filter:blur(14px);touch-action:manipulation}
body.dashboard-collapsed .dashboard-toggle::before{content:'●';color:var(--lime);font-size:9px;box-shadow:0 0 12px var(--lime)}
section{font-family:'Noto Sans TC',sans-serif;line-break:strict;overflow-wrap:break-word}
.slide{
  width:100%;height:100%;padding:78px 92px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  color:var(--ink);background-color:var(--night);
  background-image:linear-gradient(#35dcff15 1px,transparent 1px),linear-gradient(90deg,#35dcff15 1px,transparent 1px),radial-gradient(circle at 90% 0,#8b5cf642 0,transparent 34rem);
  background-size:40px 40px,40px 40px,auto;
}
.theme-violet{background-color:#160e37;background-image:linear-gradient(#ffd84d12 1px,transparent 1px),linear-gradient(90deg,#ffd84d12 1px,transparent 1px),radial-gradient(circle at 85% 5%,#ff4f9a55 0,transparent 34rem);background-size:40px 40px,40px 40px,auto}
.theme-blue{background-color:#071d3e;background-image:linear-gradient(#b9f24a12 1px,transparent 1px),linear-gradient(90deg,#b9f24a12 1px,transparent 1px),radial-gradient(circle at 90% 0,#35dcff48 0,transparent 34rem);background-size:40px 40px,40px 40px,auto}
.theme-pink{background-color:#2b0a2c;background-image:linear-gradient(#35dcff12 1px,transparent 1px),linear-gradient(90deg,#35dcff12 1px,transparent 1px),radial-gradient(circle at 85% 0,#ff4f9a55 0,transparent 34rem);background-size:40px 40px,40px 40px,auto}
.eyebrow{font:700 21px/1.4 'JetBrains Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--cyan)}
h1,h2,h3,p{margin:0}.mono{font-family:'JetBrains Mono',monospace}.muted{color:var(--muted)}
.display{font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:126px;line-height:.98;letter-spacing:-.055em;font-weight:700;text-wrap:balance}
.title{font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:72px;line-height:1.08;letter-spacing:-.035em;font-weight:700;text-wrap:balance}
.title-lg{font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:92px;line-height:1.03;letter-spacing:-.04em;font-weight:700;text-wrap:balance}
.subtitle{font-size:39px;line-height:1.33;font-weight:650;text-wrap:balance}.body{font-size:29px;line-height:1.54;font-weight:500}.body-sm{font-size:24px;line-height:1.5}
.accent{color:var(--yellow)}.accent-pink{color:var(--pink)}.accent-lime{color:var(--lime)}
.footer{position:absolute;left:92px;right:92px;bottom:38px;display:flex;justify-content:space-between;align-items:center;font:600 18px/1 'JetBrains Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:28px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.card{border:2px solid var(--line);padding:32px;border-radius:18px;background:var(--panel);min-width:0}.card.hot{border-color:#ff4f9a88;background:#ff4f9a17}.card.cool{border-color:#35dcff88;background:#35dcff13}.card.lime{border-color:#b9f24a88;background:#b9f24a12}
.card h3{font-size:35px;line-height:1.2;margin:12px 0}.card p{font-size:25px;line-height:1.48;color:var(--muted)}
.num{font:700 22px/1 'JetBrains Mono',monospace;color:var(--pink);margin-bottom:16px}.pill{display:inline-flex;padding:10px 18px;border:2px solid currentColor;border-radius:999px;font:700 18px/1 'JetBrains Mono',monospace;letter-spacing:.05em}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:46px;flex:1}.compare>div{padding:38px;border:2px solid var(--line);border-radius:18px;background:var(--panel)}.compare h3{font-size:45px;margin:20px 0}.compare li{font-size:27px;line-height:1.46;margin:12px 0}.compare ul{padding-left:28px}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:55px}.timeline>div{padding:34px;border-left:4px solid var(--cyan);background:var(--panel)}.timeline .time{font:700 22px/1 'JetBrains Mono',monospace;color:var(--yellow)}.timeline h3{font-size:43px;margin:18px 0 10px}.timeline p{font-size:25px;line-height:1.45;color:var(--muted)}
section[data-label="今年的綱要"] .slide{padding-top:58px}
section[data-label="今年的綱要"] .title{font-size:62px}
section[data-label="今年的綱要"] .timeline{margin-top:26px;gap:18px}
section[data-label="今年的綱要"] .timeline>div{padding:22px 26px}
section[data-label="今年的綱要"] .timeline h3{font-size:34px;margin:12px 0 7px}
section[data-label="今年的綱要"] .timeline p{font-size:20px;line-height:1.4}
.agenda-scope{margin-top:22px;padding:18px 24px;border-top:2px solid var(--line);display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:start;background:#0d1c3788}
.agenda-scope h3{font-size:27px}
.agenda-scope ol{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:0;padding-left:24px}
.agenda-scope li{padding-left:5px;color:var(--muted);font-size:19px;line-height:1.42}
.qr-layout{display:grid;grid-template-columns:1fr 520px;gap:64px;align-items:center;flex:1}.qr-box{background:#fff;padding:28px;border-radius:26px;box-shadow:0 24px 70px #02061270}.qr-box img{display:block;width:100%}.qr-url{font:700 22px/1.4 'JetBrains Mono',monospace;color:var(--cyan);margin-top:22px}
.tag-list{display:flex;flex-wrap:wrap;gap:14px}.tag-list span{padding:13px 19px;border:2px solid var(--line);border-radius:999px;font-size:23px;font-weight:700;background:var(--panel)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:54px}.step{padding:30px 24px;border:2px solid var(--line);border-radius:16px;background:var(--panel);min-height:230px}.step b{display:block;font-size:31px;margin:14px 0}.step span{font-size:22px;color:var(--muted)}
.sequence{display:flex;align-items:center;gap:14px;margin-top:60px}.node{flex:1;min-height:230px;padding:28px;border:2px solid var(--line);border-radius:16px;background:var(--panel);display:flex;flex-direction:column;justify-content:space-between}.node b{font-size:34px}.node span{font-size:22px;color:var(--muted)}.chev{font-size:50px;color:var(--pink)}
.role-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.role{padding:28px 23px;border:2px solid var(--line);border-radius:16px;background:var(--panel)}.role b{font:700 20px/1.2 'JetBrains Mono',monospace;color:var(--yellow)}.role h3{font-size:33px;margin:13px 0}.role p{font-size:22px;line-height:1.45;color:var(--muted)}
.matrix{display:grid;grid-template-columns:230px repeat(4,1fr);border:2px solid var(--line);border-radius:18px;overflow:hidden;margin-top:42px}.matrix>div{min-height:92px;padding:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px}.matrix>div:nth-child(5n){border-right:0}.matrix .head{font-weight:800;background:#35dcff18}.matrix .rowhead{justify-content:flex-start;font-size:26px;font-weight:800;background:#ff4f9a14}.matrix .filled{background:#8b5cf65c;font-weight:800}
.source-card{margin-top:42px;padding:28px 32px;border:2px solid var(--pink);border-radius:18px;background:#ff4f9a14}.source-card a{color:var(--cyan);font:700 19px/1.4 'JetBrains Mono',monospace}
.case-slide{padding:62px 84px 68px}.case-head{display:flex;align-items:end;justify-content:space-between;gap:40px}.case-head h2{font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:58px;line-height:1.05;letter-spacing:-.035em}.case-head .case-domain{color:var(--cyan);font:700 19px/1.4 'JetBrains Mono',monospace}.case-frame{position:relative;display:flex;flex-direction:column;min-height:0;flex:1;margin-top:28px;overflow:hidden;border:2px solid #45628f;border-radius:24px;background:#050b17;box-shadow:0 36px 90px #020612a8;color:var(--ink);text-decoration:none}.case-browser-bar{display:grid;grid-template-columns:130px 1fr 130px;align-items:center;flex:0 0 56px;padding:0 20px;border-bottom:1px solid #2a4168;background:#0d1c37}.case-dots{display:flex;gap:9px}.case-dots i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.case-dots i:nth-child(2){background:#febc2e}.case-dots i:nth-child(3){background:#28c840}.case-address{justify-self:center;max-width:760px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b9c7df;font:600 17px/1 'JetBrains Mono',monospace}.case-open{justify-self:end;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:var(--night);font:900 22px/1 'JetBrains Mono',monospace}.case-shot{position:relative;display:block;min-height:0;flex:1;overflow:hidden;background:#030712}.case-shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center;filter:saturate(1.03) contrast(1.01)}
.ghost-orbit{position:absolute;border-radius:50%;filter:blur(1px);opacity:.82}.line{height:2px;background:var(--line);width:100%}
section[data-label="我真的問過"] .card{padding:22px 28px}section[data-label="我真的問過"] .card h3{font-size:31px}
section[data-deck-active] [data-reveal],section[data-deck-active] .card,section[data-deck-active] .step,section[data-deck-active] .node,section[data-deck-active] .role,section[data-deck-active] .case-shot img{will-change:transform,opacity}
@media print{.deck-shell{display:block}.dashboard-pane{display:none}deck-stage{position:fixed}[data-reveal]{opacity:1!important;visibility:visible!important;transform:none!important}}
@media(prefers-reduced-motion:reduce){[data-reveal],.card,.step,.node,.role,.case-shot img{will-change:auto!important}}
@media(max-width:1366px){
  .deck-shell{grid-template-columns:1fr}
  .dashboard-collapse{display:none}
  .dashboard-toggle{position:fixed;right:14px;top:14px;z-index:42;display:flex;align-items:center;gap:8px;border:1px solid #35dcff88;border-radius:999px;padding:10px 14px;background:#081225ed;color:var(--cyan);font:800 13px/1 'Noto Sans TC',sans-serif;box-shadow:0 12px 34px #020612b8;backdrop-filter:blur(14px);touch-action:manipulation}
  .dashboard-toggle::before{content:'●';color:var(--lime);font-size:9px;box-shadow:0 0 12px var(--lime)}
  .dashboard-scrim{position:fixed;inset:0;z-index:39;display:block;background:#020611aa;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .dashboard-pane{position:fixed;inset:0 0 0 auto;z-index:40;display:grid;grid-template-rows:auto minmax(0,1fr);width:min(94vw,500px);height:100dvh;border-left:1px solid #45628f;box-shadow:-24px 0 70px #020611cc;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);pointer-events:none;overscroll-behavior:contain}
  .dashboard-drawer-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px 11px 16px;border-bottom:1px solid #2a4168;background:#050c1d;color:var(--ink);font:800 13px/1 'Noto Sans TC',sans-serif}
  .dashboard-drawer-bar button{display:grid;place-items:center;width:36px;height:36px;border:1px solid #45628f;border-radius:50%;background:#0d1c37;color:var(--ink);font-size:22px;line-height:1;touch-action:manipulation}
  .dashboard-pane iframe{min-height:0}
  body.dashboard-drawer-open .dashboard-pane{transform:translateX(0);pointer-events:auto}
  body.dashboard-drawer-open .dashboard-scrim{opacity:1;pointer-events:auto}
  body.dashboard-drawer-open .dashboard-toggle{opacity:0;pointer-events:none}
}
</style>

<script>
const slides=["<section data-label=\"封面\"><div class=\"slide theme-violet\">\n  <div class=\"ghost-orbit\" style=\"width:720px;height:720px;background:var(--violet);right:-250px;top:-320px\"></div>\n  <div class=\"ghost-orbit\" style=\"width:280px;height:280px;background:var(--pink);right:270px;bottom:-110px\"></div>\n  <div data-reveal class=\"eyebrow\">AI 醫點也不難 · 8/14</div>\n  <div style=\"margin-top:auto;position:relative;z-index:1\"><h1 data-reveal class=\"display\">臨床工作者的<br>AI Agent 第一課</h1><p data-reveal class=\"subtitle\" style=\"margin-top:30px\">讓 AI 提升工作品質，把驗證放進日常流程</p></div>\n  <div class=\"footer\"><span>黃豆泥 黃彥霖 M.D.</span><span>2026.08.14 · 21:00–23:00</span></div></div></section>","<section data-label=\"今年的綱要\"><div class=\"slide \">\n  <div data-reveal class=\"eyebrow\">COURSE MAP</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">今年的綱要</h2>\n  <div data-reveal class=\"timeline\"><div><div class=\"time\">00–50</div><h3>簡單版</h3><p>三個啊哈、研究流程、驗證方法。</p></div><div><div class=\"time\">50–70</div><h3>困難版</h3><p>看幾個真的做下去的互動案例。</p></div><div><div class=\"time\">70–110</div><h3>Q&A</h3><p>問題全程送出，最後依問題脈絡一起回答。</p></div></div>\n  <div class=\"footer\"><span>服務 · 教學 · 研究 · 公關</span><span>問題可以全程送出</span></div></div></section>","<section data-label=\"隨時提問\"><div class=\"slide theme-blue\">\n  <div class=\"qr-layout\"><div><div data-reveal class=\"eyebrow\">ALWAYS-OPEN QUESTION POOL</div><h2 data-reveal class=\"title-lg\" style=\"margin-top:24px\">想到就先問<br>不用等到最後</h2><p data-reveal class=\"body\" style=\"margin-top:30px\">覺得太簡單、太難或開始聽不懂，先拉動難易度。需要我補充時就直接提問，送出時會一起留下你當下的分數。相近問題可以整理成同一段，原題仍然保留。</p><div data-reveal class=\"qr-url\">mashbean.net/clinical-ai-0814/</div></div><div data-reveal class=\"qr-box\"><img src=\"qr-live.png\" alt=\"現場投票與提問 QR Code\"></div></div>\n  <div class=\"footer\"><span>難易度隨時調整 · 問題隨時送出</span><span>講後整理回覆收據</span></div></div></section>","<section data-label=\"開場投票\"><div class=\"slide theme-pink\">\n  <div class=\"qr-layout\"><div><div data-reveal class=\"eyebrow\">POLL 01 · STARTING POINT</div><h2 data-reveal class=\"title-lg\" style=\"margin-top:24px\">你現在把 AI<br>用到哪一層？</h2><div data-reveal class=\"tag-list\" style=\"margin-top:42px\"><span>偶爾聊天</span><span>搜尋與整理</span><span>交付完整任務</span><span>固定工作流</span></div></div><div data-reveal class=\"qr-box\"><img src=\"qr-live.png\" alt=\"開場投票 QR Code\"></div></div>\n  <div class=\"footer\"><span>第 1 題</span><span>答案可以修改</span></div></div></section>","<section class=\"legacy-clab\" data-label=\"02 Who I Am\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-paper\">\n      <div class=\"eyebrow\">02 · 我是誰</div>\n      <h2 class=\"title\" style=\"margin-top:24px;\">不是工程師，工作橫跨<br>政策、公共領域與產品</h2>\n      <div class=\"grid-2\" style=\"margin-top:52px;gap:28px;\">\n        <div class=\"card\" style=\"background:var(--sun);\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.12em;\">現在</div>\n          <div class=\"subtitle\" style=\"font-size:38px;\">Matters<br>總經理</div>\n          <div class=\"small\" style=\"opacity:0.7;\">抗審查<br>社群平台</div>\n        </div>\n        <div class=\"card\" style=\"background:var(--lime);\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.12em;\">研究員</div>\n          <div class=\"subtitle\" style=\"font-size:38px;\">ISF 2026<br>Global Fellow</div>\n          <div class=\"small\" style=\"opacity:0.7;\">+ AI+ Expo 下週</div>\n        </div>\n        <div class=\"card\" style=\"background:var(--magenta);color:var(--paper);\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.12em;\">政策</div>\n          <div class=\"subtitle\" style=\"font-size:38px;\">Harvard Kennedy<br>School Fellow</div>\n          <div class=\"small\" style=\"opacity:0.85;\">→ 今年九月 Oxford MPP</div>\n        </div>\n        <div class=\"card\" style=\"background:var(--ink);color:var(--paper);\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.12em;\">以前</di \"></div>\n            <div style=\"aspect-ratio:1;background:rgba(255,255,255,0.22);\"></div>\n            <div style=\"aspect-ratio:1;background:rgba(255,255,255,0.38);\"></div>\n            <div style=\"aspect-ratio:1;background:rgba(255,255,255,0.1);\"></div>\n            <div style=\"aspect-ratio:1;background:rgba(255,255,255,0.32);\"></div>\n            <div style=\"aspect-ratio:1;background:rgba(255,255,255,0.18);\"></div>\n            <div style=\"aspect-ratio:1;background:rgba(255,255,255,0.26);\"></div>\n            <div style=\"aspect-ratio:1;background:rgba(255,255,255,0.14);\"></div>\n            <div style=\"aspect-ratio:1;background:rgba(255,255,255,0.4);\"></div>\n            <div style=\"aspect-ratio:1;background:rgba(255,255,255,0.2);\"></div>\n            <div style=\"aspect-ratio:1;background:rgba(255,255,255,0.34);\"></div>\n          </div>\n          <div>\n            <div class=\"title\" style=\"font-size:88px;\">1,000+</div>\n            <div class=\"body\" style=\"opacity:0.8;\">檔案 · 完全沒結構</div>\n          </div>\n        </div>\n        <div class=\"title arrow-pulse\" style=\"font-size:120px;color:var(--sun);\">→</div>\n        <div style=\"background:var(--paper);color:var(--ink);padding:48px;height:380px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.6;\">之後 · 一次回合</div>\n          <ul class=\"clean\" style=\"margin:0;\">\n            <li style=\"padding:14px 0;\"><span class=\"marker\">/01</span><span class=\"text\" style=\"font-size:30px;\">research/</span></li>\n            <li style=\"padding:14px 0;\"><span class=\"marker\">/02</span><span class=\"text\" style=\"font-size:30px;\">policy-drafts/</span></li>\n            <li style=\"padding:14px 0;\"><span class=\"marker\">/03</span><span class=\"text\" style=\"font-size:30px;\">archive/</span></li>\n          </ul>\n          <div class=\"body\" style=\"opacity:0.7;\">命名、標日期、分類完成。</div>\n        </div>\n      </div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"10 Aha 2\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-magenta\">\n      <div class=\"eyebrow\">10 · 啊哈時刻二</div>\n      <h2 class=\"title-lg\" style=\"margin-top:24px;\">拖了好幾年的<br>部落格。</h2>\n      <div style=\"margin-top:64px;display:grid;grid-template-columns:1fr auto 1fr;gap:48px;align-items:center;flex:1;\">\n        <div style=\"display:flex;flex-direction:column;gap:18px;\">\n          <div style=\"background:var(--paper);padding:24px 32px;font-family:'JetBrains Mono',monospace;font-size:26px;\">舊臉書貼文</div>\n          <div style=\"background:var(--paper);padding:24px 32px;font-family:'JetBrains Mono',monospace;font-size:26px;margin-left:48px;\">專欄草稿（2018）</div>\n          <div style=\"background:var(--paper);padding:24px 32px;font-family:'JetBrains Mono',monospace;font-size:26px;\">散落的部落格文</div>\n          <div style=\"background:var(--paper);padding:24px 32px;font-family:'JetBrains Mono',monospace;font-size:26px;margin-left:24px;\">四個資料夾裡的 .docx</div>\n          <div style=\"background:var(--paper);padding:24px 32px;font-family:'JetBrains Mono',monospace;font-size:26px;\">備忘錄大雜燴</div>\n        </div>\n        <div class=\"title arrow-pulse\" style=\"font-size:120px;color:var(--sun);\">→</div>\n        <div style=\"background:var(--ink);color:var(--paper);padding:56px;display:flex;flex-direction:column;justify-content:center;height:100%;\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.6;\">上線 · 一個週末</div>\n          <div class=\"title\" style=\"font-size:88px;margin-top:24px;line-height:1.12;\">真正的部落格，<br>終於。</div>\n          <div class=\"body\" style=\"margin-top:32px;opacity:0.75;\">多年文字，<br>整理並發布。</div>\n        </div>\n      </div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"11 Design System\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-paper\">\n      <div class=\"eyebrow\">11 · 案例</div>\n      <h2 class=\"title\" style=\"margin-top:24px;\">設計師離開，設計系統留下。</h2>\n      <div style=\"margin-top:56px;display:grid;grid-template-columns:1.2fr auto 1.2fr auto 1fr;gap:32px;align-items:stretch;flex:1;\">\n        <div style=\"background:var(--lime);padding:36px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.7;\">來源</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:36px;\">Figma 裡的<br>設計系統</div>\n            <div class=\"small\" style=\"margin-top:16px;opacity:0.7;\">離職設計師留下的資產</div>\n          </div>\n        </div>\n        <div class=\"title\" style=\"align-self:center;font-size:72px;\">→</div>\n        <div style=\"background:var(--cobalt);color:var(--paper);padding:36px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.85;\">AGENT 週末</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:36px;\">整理<br>→ 推上 git</div>\n            <div class=\"small\" style=\"margin-top:16px;opacity:0.8;\">tokens、元件、文件</div>\n          </div>\n        </div>\n        <div class=\"title\" style=\"align-self:center;font-size:72px;\">→</div>\n        <div style=\"background:var(--ink);color:var(--paper);padding:36px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.7;\">輸出</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:36px;\">新頁面<br>2–3 小時</div>\n            <div class=\"small\" style=\"margin-top:16px;opacity:0.7;\">我不是設計師，<br>也不是前端工程師。</div>\n          </div>\n        </div>\n      </div>\n      <div class=\"body-lg\" style=\"margin-top:40px;font-weight:500;\">把服務做出來所需的人力正在快速下降。</div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"12 Pipeline\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-paper2\">\n      <div class=\"eyebrow\">12 · 研究出版流程</div>\n      <h2 class=\"title\" style=\"margin-top:24px;\">五個角色。一條接力。</h2>\n      <div style=\"margin-top:96px;flex:1;display:flex;align-items:center;\">\n        <div class=\"chevron-flow\" style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:0;width:100%;\">\n          <!-- node 1 -->\n          <div style=\"background:var(--cobalt);color:var(--paper);padding:36px 24px;text-align:center;clip-path:polygon(0 0, calc(100% - 30px) 0, 100% 50%, calc(100% - 30px) 100%, 0 100%);height:240px;display:flex;flex-direction:column;justify-content:center;\">\n            <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.85;\">01</div>\n            <div class=\"subtitle\" style=\"font-size:36px;margin-top:12px;\">研究者</div>\n            <div class=\"small\" style=\"opacity:0.85;margin-top:8px;\">蒐集來源</div>\n          </div>\n          <div style=\"background:var(--magenta);color:var(--paper);padding:36px 24px;text-align:center;clip-path:polygon(0 0, calc(100% - 30px) 0, 100% 50%, calc(100% - 30px) 100%, 0 100%, 30px 50%);height:240px;display:flex;flex-direction:column;justify-content:center;\">\n            <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.85;\">02</div>\n            <div class=\"subtitle\" style=\"font-size:36px;margin-top:12px;\">寫作者</div>\n            <div class=\"small\" style=\"opacity:0.85;margin-top:8px;\">初稿</div>\n          </div>\n          <div style=\"background:var(--sun);color:var(--ink);padding:36px 24px;text-align:center;clip-path:polygon(0 0, calc(100% - 30px) 0, 100% 50%, calc(100% - 30px) 100%, 0 100%, 30px 50%);height:240px;display:flex;flex-direction:column;justify-content:center;\">\n            <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.7;\">03</div>\n            <div class=\"subtitle\" style=\"font-size:36px;margin-top:12px;\">批判者</div>\n            <div class=\"small\" style=\"opacity:0.75;margin-top:8px;\">壓力測試</div>\n          </div>\n          <div style=\"background:var(--lime);color:var(--ink);padding:36px 24px;text-align:center;clip-path:polygon(0 0, calc(100% - 30px) 0, 100% 50%, calc(100% - 30px) 100%, 0 100%, 30px 50%);height:240px;display:flex;flex-direction:column;justify-content:center;\">\n            <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.7;\">04</div>\n            <div class=\"subtitle\" style=\"font-size:36px;margin-top:12px;\">編輯</div>\n            <div class=\"small\" style=\"opacity:0.75;margin-top:8px;\">修稿</div>\n          </div>\n          <div style=\"background:var(--ink);color:var(--paper);padding:36px 24px;text-align:center;clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 30px 50%);height:240px;display:flex;flex-direction:column;justify-content:center;\">\n            <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.7;\">05</div>\n            <div class=\"subtitle\" style=\"font-size:36px;margin-top:12px;\">發布者</div>\n            <div class=\"small\" style=\"opacity:0.75;margin-top:8px;\">交付成果</div>\n          </div>\n        </div>\n      </div>\n      <div class=\"body-lg\" style=\"margin-top:64px;\">每個角色都有自己的提示詞、任務與責任。</div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"13 Why Pipelines\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-paper\">\n      <div class=\"eyebrow\">13 · 為什麼流程重要</div>\n      <h2 class=\"title\" style=\"margin-top:24px;\">把流程標準化。<br>品質就不再漂移。</h2>\n      <div style=\"margin-top:72px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;flex:1;\">\n        <div style=\"background:var(--cobalt);color:var(--paper);padding:40px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div class=\"num-marker\" style=\"font-size:160px;color:var(--sun);\">01</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:34px;\">標準化<br>流程</div>\n          </div>\n        </div>\n        <div style=\"background:var(--magenta);color:var(--paper);padding:40px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div class=\"num-marker\" style=\"font-size:160px;color:var(--sun);\">02</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:34px;\">穩定<br>品質</div>\n          </div>\n        </div>\n        <div style=\"background:var(--sun);color:var(--ink);padding:40px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div class=\"num-marker\" style=\"font-size:160px;color:var(--magenta);\">03</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:34px;\">幻覺<br>大幅減少</div>\n          </div>\n        </div>\n        <div style=\"background:var(--lime);color:var(--ink);padding:40px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div class=\"num-marker\" style=\"font-size:160px;color:var(--cobalt);\">04</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:34px;\">持續<br>改善</div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"14 Reasoning Chain\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-ink\">\n      <div class=\"eyebrow\" style=\"opacity:0.65;\">14 · 推理鏈</div>\n      <h2 class=\"title\" style=\"margin-top:24px;color:var(--paper);\">這是思考結構，<br>不只是寫作。</h2>\n      <div style=\"margin-top:80px;display:flex;align-items:center;justify-content:space-between;flex:1;\">\n        <div class=\"chain-node\" style=\"display:flex;flex-direction:column;align-items:center;gap:24px;\">\n          <div style=\"width:200px;height:200px;border-radius:50%;background:var(--cobalt);color:var(--paper);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;\">\n            <div class=\"subtitle\" style=\"font-size:30px;\">核心<br>問題</div>\n          </div>\n          <div class=\"mono\" style=\"font-size:24px;color:var(--paper);opacity:0.6;\">01</div>\n        </div>\n        <div class=\"mono chain-arrow\" style=\"font-size:48px;color:var(--paper);opacity:0.4;\">→</div>\n        <div class=\"chain-node\" style=\"display:flex;flex-direction:column;align-items:center;gap:24px;\">\n          <div style=\"width:200px;height:200px;border-radius:50%;background:var(--magenta);color:var(--paper);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;\">\n            <div class=\"subtitle\" style=\"font-size:30px;\">子<br>論點</div>\n          </div>\n          <div class=\"mono\" style=\"font-size:24px;color:var(--paper);opacity:0.6;\">02</div>\n        </div>\n        <div class=\"mono chain-arrow\" style=\"font-size:48px;color:var(--paper);opacity:0.4;\">→</div>\n        <div class=\"chain-node\" style=\"display:flex;flex-direction:column;align-items:center;gap:24px;\">\n          <div style=\"width:200px;height:200px;border-radius:50%;background:var(--sun);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;\">\n            <div class=\"subtitle\" style=\"font-size:30px;\">證據</div>\n          </div>\n          <div class=\"mono\" style=\"font-size:24px;color:var(--paper);opacity:0.6;\">03</div>\n        </div>\n        <div class=\"mono chain-arrow\" style=\"font-size:48px;color:var(--paper);opacity:0.4;\">→</div>\n        <div class=\"chain-node\" style=\"display:flex;flex-direction:column;align-items:center;gap:24px;\">\n          <div style=\"width:200px;height:200px;border-radius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;\">\n            <div class=\"subtitle\" style=\"font-size:30px;\">風險<br>檢查</div>\n          </div>\n          <div class=\"mono\" style=\"font-size:24px;color:var(--paper);opacity:0.6;\">04</div>\n        </div>\n        <div class=\"mono chain-arrow\" style=\"font-size:48px;color:var(--paper);opacity:0.4;\">→</div>\n        <div class=\"chain-node\" style=\"display:flex;flex-direction:column;align-items:center;gap:24px;\">\n          <div style=\"width:200px;height:200px;border-radius:50%;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;\">\n            <div class=\"subtitle\" style=\"font-size:30px;\">整合</div>\n          </div>\n          <div class=\"mono\" style=\"font-size:24px;color:var(--paper);opacity:0.6;\">05</div>\n        </div>\n      </div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"15 Reasoning Types\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-paper\">\n      <div class=\"eyebrow\">15 · 五種推理</div>\n      <h2 class=\"title\" style=\"margin-top:24px;\">每一種都有不同風險。</h2>\n      <div style=\"margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;\">\n        <div style=\"background:var(--cobalt);color:var(--paper);padding:32px;display:flex;align-items:baseline;gap:32px;\">\n          <div class=\"mono\" style=\"font-size:24px;opacity:0.7;width:60px;flex-shrink:0;\">01</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:38px;\">演繹</div>\n            <div class=\"body\" style=\"opacity:0.85;margin-top:8px;\">把規則套到案例</div>\n          </div>\n        </div>\n        <div style=\"background:var(--magenta);color:var(--paper);padding:32px;display:flex;align-items:baseline;gap:32px;\">\n          <div class=\"mono\" style=\"font-size:24px;opacity:0.7;width:60px;flex-shrink:0;\">02</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:38px;\">歸納</div>\n            <div class=\"body\" style=\"opacity:0.85;margin-top:8px;\">從案例找模式</div>\n          </div>\n        </div>\n        <div style=\"background:var(--sun);color:var(--ink);padding:32px;display:flex;align-items:baseline;gap:32px;\">\n          <div class=\"mono\" style=\"font-size:24px;opacity:0.6;width:60px;flex-shrink:0;\">03</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:38px;\">類比</div>\n            <div class=\"body\" style=\"opacity:0.7;margin-top:8px;\">比較相似案例</div>\n          </div>\n        </div>\n        <div style=\"background:var(--lime);color:var(--ink);padding:32px;display:flex;align-items:baseline;gap:32px;\">\n          <div class=\"mono\" style=\"font-size:24px;opacity:0.6;width:60px;flex-shrink:0;\">04</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:38px;\">溯因</div>\n            <div class=\"body\" style=\"opacity:0.7;margin-top:8px;\">尋找最佳解釋</div>\n          </div>\n        </div>\n        <div style=\"background:var(--ink);color:var(--paper);padding:32px;display:flex;align-items:baseline;gap:32px;grid-column:1 / span 2;\">\n          <div class=\"mono\" style=\"font-size:24px;opacity:0.65;width:60px;flex-shrink:0;\">05</div>\n          <div>\n            <div class=\"subtitle\" style=\"font-size:38px;\">因果推理</div>\n            <div class=\"body\" style=\"opacity:0.75;margin-top:8px;\">解釋原因與結果 · 風險最高，需要最多證據</div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"16 Daily Practice\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-sun\">\n      <div class=\"eyebrow\">16 · 每日訓練</div>\n      <h2 class=\"title-lg\" style=\"margin-top:24px;\">每天一個<br>真正困難的問題。</h2>\n      <div style=\"margin-top:72px;display:grid;grid-template-columns:repeat(4,1fr);gap:0;flex:1;\">\n        <div style=\"padding:36px 32px 36px 0;border-right:3px solid var(--ink);\">\n          <div class=\"num-marker\" style=\"font-size:140px;\">①</div>\n          <div class=\"subtitle\" style=\"font-size:34px;margin-top:16px;\">提問</div>\n          <div class=\"body\" style=\"margin-top:8px;opacity:0.75;\">值得花一天處理的真問題。</div>\n        </div>\n        <div style=\"padding:36px 32px;border-right:3px solid var(--ink);\">\n          <div class=\"num-marker\" style=\"font-size:140px;\">②</div>\n          <div class=\"subtitle\" style=\"font-size:34px;margin-top:16px;\">執行</div>\n          <div class=\"body\" style=\"margin-top:8px;opacity:0.75;\">把它推進流程。</div>\n        </div>\n        <div style=\"padding:36px 32px;border-right:3px solid var(--ink);\">\n          <div class=\"num-marker\" style=\"font-size:140px;\">③</div>\n          <div class=\"subtitle\" style=\"font-size:34px;margin-top:16px;\">發布</div>\n          <div class=\"body\" style=\"margin-top:8px;opacity:0.75;\">寫成文章或存檔。</div>\n        </div>\n        <div style=\"padding:36px 0 36px 32px;\">\n          <div class=\"num-marker\" style=\"font-size:140px;\">④</div>\n          <div class=\"subtitle\" style=\"font-size:34px;margin-top:16px;\">調校</div>\n          <div class=\"body\" style=\"margin-top:8px;opacity:0.75;\">改善提示詞與角色。</div>\n        </div>\n      </div>\n      <div class=\"body-lg\" style=\"margin-top:40px;font-style:italic;\">我在訓練自己問得更好，也訓練 Agent 答得更好。</div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"17 Example Qs\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-cobalt\">\n      <div class=\"eyebrow\" style=\"opacity:0.85;\">17 · 我真的問過的問題</div>\n      <h2 class=\"title\" style=\"margin-top:24px;color:var(--paper);\">那些還沒有人<br>可以一起討論的問題。</h2>\n      <div style=\"margin-top:64px;display:flex;flex-direction:column;gap:20px;flex:1;\">\n        <div class=\"q-item\" style=\"background:var(--paper);padding:32px 40px;display:flex;align-items:baseline;gap:32px;\">\n          <div class=\"mono\" style=\"font-size:26px;font-weight:700;color:var(--magenta);width:50px;flex-shrink:0;\">Q1</div>\n          <div class=\"subtitle\" style=\"font-size:38px;\">國際上哪些媒體收益分潤模式真的有效？</div>\n        </div>\n        <div class=\"q-item\" style=\"background:var(--paper);padding:32px 40px;display:flex;align-items:baseline;gap:32px;\">\n          <div class=\"mono\" style=\"font-size:26px;font-weight:700;color:var(--magenta);width:50px;flex-shrink:0;\">Q2</div>\n          <div class=\"subtitle\" style=\"font-size:38px;\">我們如何評估流亡社群的影響力？</div>\n        </div>\n        <div class=\"q-item\" style=\"background:var(--paper);padding:32px 40px;display:flex;align-items:baseline;gap:32px;\">\n          <div class=\"mono\" style=\"font-size:26px;font-weight:700;color:var(--magenta);width:50px;flex-shrink:0;\">Q3</div>\n          <div class=\"subtitle\" style=\"font-size:38px;\">AI Agent 身分需要什麼政策？</div>\n        </div>\n        <div class=\"q-item\" style=\"background:var(--paper);padding:32px 40px;display:flex;align-items:baseline;gap:32px;\">\n          <div class=\"mono\" style=\"font-size:26px;font-weight:700;color:var(--magenta);width:50px;flex-shrink:0;\">Q4</div>\n          <div class=\"subtitle\" style=\"font-size:38px;\">各國年齡驗證法律的真實效果是什麼？</div>\n        </div>\n      </div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"18 Humans\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-lime\">\n      <div class=\"eyebrow\">18 · 人還是要做什麼</div>\n      <h2 class=\"title\" style=\"margin-top:24px;\">委任無聊的事。<br>保留判斷。</h2>\n      <div style=\"margin-top:64px;display:grid;grid-template-columns:1fr 1fr;gap:48px;flex:1;\">\n        <div style=\"background:var(--ink);color:var(--paper);padding:48px;\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.6;\">委任給 AGENT</div>\n          <ul class=\"clean\" style=\"margin-top:32px;color:var(--paper);\">\n            <li style=\"border-color:rgba(255,255,255,0.2);\"><span class=\"text\" style=\"font-size:32px;\">重複工作</span></li>\n            <li style=\"border-color:rgba(255,255,255,0.2);\"><span class=\"text\" style=\"font-size:32px;\">檔案整理</span></li>\n            <li style=\"border-color:rgba(255,255,255,0.2);\"><span class=\"text\" style=\"font-size:32px;\">初稿</span></li>\n            <li style=\"border-color:rgba(255,255,255,0.2);\"><span class=\"text\" style=\"font-size:32px;\">資料清理</span></li>\n          </ul>\n        </div>\n        <div style=\"background:var(--paper);padding:48px;\">\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.6;\">留給自己</div>\n          <ul class=\"clean\" style=\"margin-top:32px;\">\n            <li><span class=\"text\" style=\"font-size:32px;\">提出問題</span></li>\n            <li><span class=\"text\" style=\"font-size:32px;\">判斷答案</span></li>\n            <li><span class=\"text\" style=\"font-size:32px;\">做決定</span></li>\n            <li><span class=\"text\" style=\"font-size:32px;\">品味與脈絡</span></li>\n          </ul>\n        </div>\n      </div>\n      <div class=\"body-lg\" style=\"margin-top:32px;font-style:italic;opacity:0.75;\">靈感來自走路。我寧願多走一點。</div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"19 Who\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-magenta\">\n      <div class=\"eyebrow\">19 · 誰最適合用 Agent</div>\n      <h2 class=\"title\" style=\"margin-top:24px;\">兩種人<br>最能用出效果。</h2>\n      <div style=\"margin-top:64px;display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1;\">\n        <div style=\"background:var(--paper);color:var(--ink);padding:56px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div>\n            <div class=\"num-marker\" style=\"font-size:200px;color:var(--magenta);\">A</div>\n            <div class=\"title\" style=\"font-size:60px;margin-top:24px;\">有品味<br>的人</div>\n          </div>\n          <div class=\"body\" style=\"opacity:0.75;\">你能問出只有你<br>才想得到的問題。</div>\n        </div>\n        <div style=\"background:var(--ink);color:var(--paper);padding:56px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div>\n            <div class=\"num-marker\" style=\"font-size:200px;color:var(--sun);\">B</div>\n            <div class=\"title\" style=\"font-size:60px;margin-top:24px;\">有資料<br>的人</div>\n          </div>\n          <div class=\"body\" style=\"opacity:0.75;\">你知道來源在哪裡，<br>也知道怎麼組合。</div>\n        </div>\n      </div>\n    </div>\n  </template></section>","<section class=\"legacy-clab\" data-label=\"20 Closing\"><template class=\"legacy-clab-template\">\n    <div class=\"slide bg-ink\" style=\"position:relative;overflow:hidden;\">\n      <div class=\"blob-a\" style=\"position:absolute;bottom:-580px;left:-620px;width:700px;height:700px;border-radius:50%;background:var(--cobalt);\"></div>\n      <div class=\"blob-b\" style=\"position:absolute;top:-160px;right:-120px;width:480px;height:480px;border-radius:50%;background:var(--magenta);\"></div>\n      <div class=\"blob-c\" style=\"position:absolute;bottom:120px;right:-90px;width:200px;height:200px;border-radius:50%;background:var(--lime);\"></div>\n      <div style=\"position:relative;z-index:2;display:flex;flex-direction:column;height:100%;\">\n        <div class=\"eyebrow\" style=\"opacity:0.7;color:var(--paper);\">20 · 明天就試</div>\n        <h2 class=\"title-xl\" style=\"margin-top:28px;color:var(--paper);font-size:106px;\">問更好的<br>問題。<br><span style=\"color:var(--sun);\">用更好的<br>方法。</span></h2>\n        <div style=\"margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;color:var(--paper);\">\n          <div>\n            <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.6;\">01</div>\n            <div class=\"body\" style=\"margin-top:12px;\">下載一個 Agent</div>\n          </div>\n          <div>\n            <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.6;\">02</div>\n            <div class=\"body\" style=\"margin-top:12px;\">選更強的模型</div>\n          </div>\n          <div>\n            <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.6;\">03</div>\n            <div class=\"body\" style=\"margin-top:12px;\">問一個難題</div>\n          </div>\n          <div>\n            <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.6;\">04</div>\n            <div class=\"body\" style=\"margin-top:12px;\">把重複工作變流程</div>\n          </div>\n        </div>\n        <div style=\"margin-top:64px;display:flex;justify-content:space-between;align-items:flex-end;color:var(--paper);\">\n          <div class=\"title\" style=\"font-size:60px;line-height:1.2;\">謝謝。</div>\n          <div class=\"mono\" style=\"font-size:24px;letter-spacing:0.1em;opacity:0.7;\">MashBean · C-LAB 0610</div>\n        </div>\n      </div>\n    </div>\n  </template></section>","<section data-label=\"啊哈二 走路\"><div class=\"slide \">\n  <div data-reveal class=\"eyebrow\">AHA · WALKING</div><h2 data-reveal class=\"title-lg\" style=\"margin-top:24px\">靈感來自走路。<br>我寧願多走一點。</h2>\n  <div data-reveal class=\"grid-3\" style=\"margin-top:auto\"><div class=\"card\"><div class=\"num\">01</div><h3>先讓 Agent 走</h3><p>把整理、搜尋與初稿交出去。</p></div><div class=\"card hot\"><div class=\"num\">02</div><h3>自己保留路感</h3><p>知道問題在哪，也知道何時偏航。</p></div><div class=\"card lime\"><div class=\"num\">03</div><h3>最後一起回看</h3><p>把方法帶走，下一次走得更快。</p></div></div>\n  <div class=\"footer\"><span>委任腳程</span><span>保留方向感</span></div></div></section>","<section data-label=\"蜂群與瓶頸\"><div class=\"slide theme-violet\">\n  <div data-reveal class=\"eyebrow\">SWARM · BOTTLENECK</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">Agent 像蜂群。<br>真正的瓶頸慢慢變成我。</h2>\n  <div data-reveal class=\"grid-3\" style=\"margin-top:auto\"><div class=\"card cool\"><h3>它們可以同時做</h3><p>研究、整理、改稿、做圖、跑測試。</p></div><div class=\"card hot\"><h3>我還是只有一個人</h3><p>看結果、做判斷、決定往哪走。</p></div><div class=\"card lime\"><h3>所以要設計收網</h3><p>停下並驗收，否則產出只會一直堆高。</p></div></div>\n  <div class=\"footer\"><span>多 Agent 不等於多判斷</span><span>人類瓶頸要被看見</span></div></div></section>","<section data-label=\"虛偽全能感\"><div class=\"slide theme-pink\">\n  <div data-reveal class=\"eyebrow\">THE FALSE OMNIPOTENCE TRAP</div><h2 data-reveal class=\"display\" style=\"font-size:106px;margin-top:auto\">做得到很多事，<br>很容易誤以為<br>每件事都該做。</h2><p data-reveal class=\"subtitle muted\" style=\"margin-top:30px\">工具能力上升之後，選擇題反而變多。真正稀缺的是注意力、責任與收手的時機。</p>\n  <div class=\"footer\"><span>能力增加</span><span>邊界要更清楚</span></div></div></section>","<section data-label=\"Maker 能動性\"><div class=\"slide theme-blue\">\n  <div data-reveal class=\"eyebrow\">MAKER AGENCY</div><h2 data-reveal class=\"title-lg\" style=\"margin-top:24px\">以前要等資源。<br>現在可以先做一版。</h2>\n  <div data-reveal class=\"grid-3\" style=\"margin-top:auto\"><div class=\"card\"><h3>先把問題放上桌</h3><p>不必等到組織排出完整專案。</p></div><div class=\"card hot\"><h3>讓別人看見</h3><p>網頁、文章、原型都能成為討論材料。</p></div><div class=\"card lime\"><h3>用回饋決定下一步</h3><p>值得做，再投入更多資源。</p></div></div>\n  <div class=\"footer\"><span>Release early 的精神</span><span>能動性先發生</span></div></div></section>","<section data-label=\"非工程師優勢\"><div class=\"slide theme-blue\">\n  <div data-reveal class=\"eyebrow\">DOMAIN EXPERT ADVANTAGE</div><h2 data-reveal class=\"title-lg\" style=\"margin-top:26px\">非工程師的優勢<br>其實很難取代。</h2>\n  <div data-reveal class=\"grid-3\" style=\"margin-top:auto\"><div class=\"card cool\"><h3>你知道哪裡不對勁</h3><p>語氣、脈絡、風險都靠領域經驗。</p></div><div class=\"card hot\"><h3>你知道問題值不值得問</h3><p>工具擅長答題，題目仍由人決定。</p></div><div class=\"card lime\"><h3>你知道成果能不能交</h3><p>驗收標準來自工作現場。</p></div></div>\n  <div class=\"footer\"><span>領域知識是槓桿</span><span>Agent 把它放大</span></div></div></section>","<section data-label=\"啊哈三 慢下來\"><div class=\"slide theme-violet\">\n  <div data-reveal class=\"eyebrow\">AHA · SLOW DOWN</div><h2 data-reveal class=\"display\" style=\"font-size:110px;margin-top:auto\">工具變快之後，<br>我反而學會慢下來。</h2><p data-reveal class=\"subtitle muted\" style=\"margin-top:32px\">先定義問題、再等研究、接著查來源，最後才決定要不要發布。快的是機器，節奏還是自己的。</p>\n  <div class=\"footer\"><span>第三個啊哈</span><span>速度留給工具，節奏留給自己</span></div></div></section>","<section data-label=\"胡椒鹽\"><div class=\"slide theme-pink\">\n  <div data-reveal class=\"eyebrow\">POLL 02 · PEPPER & SALT</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">臨床人的胡椒鹽<br>哪裡最值得 Agent 進場？</h2>\n  <div style=\"display:grid;grid-template-columns:1fr 320px;gap:28px;margin-top:40px;flex:1\"><div data-reveal class=\"role-grid\"><div class=\"role\"><b>01</b><h3>服務</h3><p>行政、報表、申請、追蹤</p></div><div class=\"role\"><b>02</b><h3>教學</h3><p>讀書會、教材、題庫、回饋</p></div><div class=\"role\"><b>03</b><h3>研究</h3><p>文獻、資料整理、引註查核</p></div><div class=\"role\"><b>04</b><h3>公關</h3><p>衛教、社群、簡報、對外說明</p></div></div><div data-reveal class=\"qr-box\" style=\"align-self:center;padding:20px\"><img src=\"qr-live.png\" alt=\"胡椒鹽工作投票 QR Code\"></div></div>\n  <div class=\"footer\"><span>最耗時的工作</span><span>常常也是最適合先流程化的工作</span></div></div></section>","<section data-label=\"今年的工作流\"><div class=\"slide \">\n  <div data-reveal class=\"eyebrow\">MY WORKFLOW · 2026</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">我現在怎麼把難題做下去</h2>\n  <div data-reveal class=\"flow\"><div class=\"step\"><div class=\"num\">01</div><b>想一個難題</b><span>先定義真正想知道的事</span></div><div class=\"step\"><div class=\"num\">02</div><b>做研究</b><span>讓 Agent 找來源與反例</span></div><div class=\"step\"><div class=\"num\">03</div><b>放上個人網頁</b><span>先讓問題進入公共討論</span></div><div class=\"step\"><div class=\"num\">04</div><b>收網做簡報</b><span>時間到了就整理成可講的版本</span></div><div class=\"step\"><div class=\"num\">05</div><b>做互動專案</b><span>值得再走，就讓大家能操作</span></div></div>\n  <div class=\"footer\"><span>研究 → 發布 → 簡報 → 互動</span><span>每一步都有可驗收成果</span></div></div></section>","<section data-label=\"驗證工作流\"><div class=\"slide theme-blue\">\n  <div data-reveal class=\"eyebrow\">VERIFY THE OUTPUT</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">Agent 做得快。<br>成果自行檢驗。</h2>\n  <div data-reveal class=\"grid-4\" style=\"margin-top:auto\"><div class=\"card\"><div class=\"num\">01</div><h3>來源</h3><p>網址、作者、日期、原文是否存在。</p></div><div class=\"card\"><div class=\"num\">02</div><h3>反例</h3><p>有沒有證據推翻這個說法。</p></div><div class=\"card\"><div class=\"num\">03</div><h3>重跑</h3><p>換一個模型或方法，看結論是否穩定。</p></div><div class=\"card\"><div class=\"num\">04</div><h3>簽核</h3><p>最後由理解風險的人決定能不能交。</p></div></div>\n  <div class=\"footer\"><span>驗證寫進流程</span><span>完成才有可信度</span></div></div></section>","<section data-label=\"錯話像完成品\"><div class=\"slide theme-violet\">\n  <div data-reveal class=\"eyebrow\">AI SLOP · PROFESSIONAL RISK</div><h2 data-reveal class=\"display\" style=\"font-size:110px;margin-top:auto\">AI 會說錯話。<br>麻煩的是，<br>錯話很像完成品。</h2><p data-reveal class=\"subtitle muted\" style=\"margin-top:30px\">引用、圖表、摘要與建議都可能長得很完整。流程要能在交付前抓到錯誤。</p>\n  <div class=\"footer\"><span>看起來完整</span><span>不等於可以交差</span></div></div></section>","<section data-label=\"臨床期刊案例\"><div class=\"slide theme-pink\">\n  <div data-reveal class=\"eyebrow\">CASE DISCUSSION · JOURNAL OF COSMETIC DERMATOLOGY</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">一篇臨床綜述<br>引用先壞掉了</h2>\n  <div data-reveal class=\"grid-3\" style=\"margin-top:38px\"><div class=\"card\"><div class=\"num\">2026.02</div><h3>文章上線</h3><p>主題是微針治療雄性禿的臨床效果與機轉。</p></div><div class=\"card hot\"><div class=\"num\">追查後</div><h3>多筆引用無效</h3><p>作者後續提供的 DOI 與連結仍然不正確。</p></div><div class=\"card lime\"><div class=\"num\">2026.04</div><h3>期刊撤稿</h3><p>編輯部並指出，可能存在未經充分檢視的 AI 生成內容。</p></div></div>\n  <div data-reveal class=\"source-card\"><p class=\"subtitle\">如果你是第一作者、共同作者、審稿人或編輯，哪一關應該最早發現？</p><a href=\"https://onlinelibrary.wiley.com/doi/10.1111/jocd.70868\" target=\"_blank\" rel=\"noreferrer\">Wiley retraction notice · doi:10.1111/jocd.70868 ↗</a></div>\n  <div class=\"footer\"><span>案例討論</span><span>作者、共同作者、審稿人、編輯部</span></div></div></section>","<section data-label=\"Agent 邊界投票\"><div class=\"slide theme-pink\">\n  <div class=\"qr-layout\"><div><div data-reveal class=\"eyebrow\">POLL 03 · TASK BOUNDARY</div><h2 data-reveal class=\"title\" style=\"margin-top:24px\">你願意先把哪一步<br>交給 Agent？</h2><div data-reveal class=\"tag-list\" style=\"margin-top:40px\"><span>找資料與整理來源</span><span>把素材排成結構</span><span>產出可編輯初稿</span><span>執行整套流程並回報</span></div></div><div data-reveal class=\"qr-box\"><img src=\"qr-live.png\" alt=\"Agent 任務邊界投票 QR Code\"></div></div>\n  <div class=\"footer\"><span>第 3 題</span><span>先交哪一步</span></div></div></section>","<section data-label=\"Krakauer 分隔\"><div class=\"slide theme-blue\">\n  <div data-reveal class=\"eyebrow\">DAVID KRAKAUER · COGNITIVE TOOLS</div><h2 data-reveal class=\"display\" style=\"font-size:114px;margin-top:auto\">工具提高能力時<br>也可能削弱智能</h2><p data-reveal class=\"subtitle muted\" style=\"margin-top:32px\">關鍵測試是，工具拿掉後，有什麼能力真正留在你身上。</p>\n  <div class=\"footer\"><span>升級版閱讀</span><span>增益或削弱</span></div></div></section>","<section data-label=\"能力與智能\"><div class=\"slide \">\n  <div data-reveal class=\"eyebrow\">CAPABILITY ≠ INTELLIGENCE</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">工具可以提高你完成的事，<br>同時降低你獨立能做的事。</h2>\n  <div data-reveal class=\"compare\"><div><span class=\"pill\">能力</span><h3>工具增加了什麼</h3><ul><li>請別人回答問題</li><li>讓裝置替你做事</li><li>當下得到答案</li></ul></div><div><span class=\"pill\" style=\"color:var(--lime)\">智能</span><h3>它留下了什麼</h3><ul><li>下次能不能自己找到答案</li><li>方法有沒有轉化進心智</li><li>工具離手後依然擁有</li></ul></div></div>\n  <div class=\"footer\"><span>能力是完成</span><span>智能是留下</span></div></div></section>","<section data-label=\"能否重建工具\"><div class=\"slide theme-violet\">\n  <div data-reveal class=\"eyebrow\">CAN YOU REBUILD IT IN YOUR HEAD?</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">你能在腦中重建這個工具嗎？</h2>\n  <div data-reveal class=\"compare\"><div><span class=\"pill\" style=\"color:var(--lime)\">可以</span><h3>工具與你互補</h3><ul><li>結構可以被內化</li><li>地圖變成測繪知識</li><li>指南針變成心中的幾何</li></ul></div><div><span class=\"pill\" style=\"color:var(--pink)\">不行</span><h3>工具開始與你競爭</h3><ul><li>運作保持不透明</li><li>你只能一直向它查詢</li><li>GPS 永遠留在外部</li></ul></div></div>\n  <div class=\"footer\"><span>可解釋 ⇔ 可內化</span><span>能力才有機會轉移</span></div></div></section>","<section data-label=\"四種暫存器\"><div class=\"slide \">\n  <div data-reveal class=\"eyebrow\">WHAT DID THE TOOL TAKE OVER?</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">工具一步步接管記憶、操作、路徑與目標</h2>\n  <div data-reveal class=\"matrix\"><div class=\"head\"></div><div class=\"head\">記憶</div><div class=\"head\">操作</div><div class=\"head\">路徑策略</div><div class=\"head\">目標策略</div><div class=\"rowhead\">指南針</div><div></div><div class=\"filled\">方向公設</div><div></div><div></div><div class=\"rowhead\">地圖</div><div class=\"filled\">空間佈局</div><div></div><div></div><div></div><div class=\"rowhead\">GPS</div><div class=\"filled\">道路地圖</div><div class=\"filled\">定位</div><div class=\"filled\">選路</div><div>由你設定</div><div class=\"rowhead\">LLM 神諭</div><div class=\"filled\">回想</div><div class=\"filled\">解題</div><div class=\"filled\">選方法</div><div class=\"filled\">設定目標</div></div>\n  <div class=\"footer\"><span>紫底代表工具承載</span><span>目標也能被外包</span></div></div></section>","<section data-label=\"工具與使用者\"><div class=\"slide theme-pink\">\n  <div data-reveal class=\"eyebrow\">WHICH ONE IS THE USER?</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">哪一個是工具，哪一個是使用者？</h2>\n  <div data-reveal class=\"compare\"><div><div class=\"num\">轉換器 A</div><h3>讀取、寫入、轉換</h3><p class=\"body muted\">人和工具都可以抽象成同一類物件。</p></div><div><div class=\"num\">真正的分界</div><h3>誰握有目標</h3><p class=\"body muted\">決定要達成什麼的組件，就是使用者。只為它服務的組件，就是工具。</p></div></div>\n  <div class=\"footer\"><span>界線不在材質</span><span>界線在目標由誰設定</span></div></div></section>","<section data-label=\"工具如何內化\"><div class=\"slide \">\n  <div data-reveal class=\"eyebrow\">HOW A TOOL BECOMES PART OF YOU</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">工具要內化，至少過三關。</h2>\n  <div data-reveal class=\"grid-3\" style=\"margin-top:auto\"><div class=\"card cool\"><div class=\"num\">01 · 透明度</div><h3>能看進去嗎？</h3><p>看不見結構，只能一直查詢。</p></div><div class=\"card hot\"><div class=\"num\">02 · 可壓縮性</div><h3>能化成小東西嗎？</h3><p>重建成本太高，方法帶不走。</p></div><div class=\"card lime\"><div class=\"num\">03 · 物質性</div><h3>副本放得進腦中嗎？</h3><p>任務大到溢出，依賴仍留在外面。</p></div></div>\n  <div class=\"footer\"><span>三關都過</span><span>工具的結構才有機會留下</span></div></div></section>","<section data-label=\"對話或神諭\"><div class=\"slide theme-blue\">\n  <div data-reveal class=\"eyebrow\">DIALOGUE OR ORACLE</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">同一個模型，可以當教練，也可以當思想的 GPS</h2>\n  <div data-reveal class=\"compare\"><div><span class=\"pill\" style=\"color:var(--cyan)\">對話</span><h3>你保留目標與驗證</h3><ul><li>要求提出證據與反例</li><li>自己選路徑與停損點</li><li>能說明為何接受結論</li></ul></div><div><span class=\"pill\" style=\"color:var(--pink)\">神諭</span><h3>把答案整段接走</h3><ul><li>只看結論，不看證據</li><li>讓模型決定方法與目的</li><li>錯誤直到後果出現才被看見</li></ul></div></div>\n  <div class=\"footer\"><span>你決定界線畫在哪裡</span><span>LLM 是可選擇的工具</span></div></div></section>","<section data-label=\"工具拿掉後\"><div class=\"slide theme-violet\">\n  <div data-reveal class=\"eyebrow\">THE REMOVAL TEST</div><h2 data-reveal class=\"title-lg\" style=\"margin-top:28px\">拿掉 AI 之後<br>什麼留下來？</h2>\n  <div data-reveal class=\"grid-4\" style=\"margin-top:auto\"><div class=\"card\"><div class=\"num\">01</div><h3>成品</h3><p>報告、簡報、網站或文件。</p></div><div class=\"card\"><div class=\"num\">02</div><h3>提示詞</h3><p>下一次可以重用的指令片段。</p></div><div class=\"card\"><div class=\"num\">03</div><h3>方法</h3><p>資料來源、查核步驟與驗收門檻。</p></div><div class=\"card\"><div class=\"num\">04</div><h3>判斷</h3><p>自己更能辨認好答案與危險答案。</p></div></div>\n  <div class=\"footer\"><span>越往右越能內化</span><span>工作流要留下方法</span></div></div></section>","<section data-label=\"驗收優先投票\"><div class=\"slide theme-pink\">\n  <div class=\"qr-layout\"><div><div data-reveal class=\"eyebrow\">POLL 04 · DELIVERY GATE</div><h2 data-reveal class=\"title\" style=\"margin-top:24px\">成果交付前<br>你最想先守住哪一關？</h2><div data-reveal class=\"tag-list\" style=\"margin-top:40px\"><span>來源找得到</span><span>數字重算得出來</span><span>內容符合現場脈絡</span><span>最後有人簽核</span></div></div><div data-reveal class=\"qr-box\"><img src=\"qr-live.png\" alt=\"成果驗收優先順序投票 QR Code\"></div></div>\n  <div class=\"footer\"><span>第 4 題</span><span>驗收優先順序</span></div></div></section>","<section data-label=\"簡單版收束\"><div class=\"slide theme-blue\">\n  <div data-reveal class=\"eyebrow\">PHASE 01 · TAKEAWAY</div><h2 data-reveal class=\"display\" style=\"font-size:104px;margin-top:auto\">難題讓模型多想。<br>成果自行檢驗。<br>最後的判斷留在自己手上。</h2><div data-reveal class=\"line\" style=\"margin:38px 0 28px\"></div><p data-reveal class=\"body\">Agent 能讀檔、用工具、一直做下去。你要先講清楚它可以走多遠，回來時又要拿什麼驗收。</p>\n  <div class=\"footer\"><span>前 50 分鐘完成</span><span>進入困難版</span></div></div></section>","<section data-label=\"三個助力\"><div class=\"slide \">\n  <div data-reveal class=\"eyebrow\">WHAT ACTUALLY HELPED ME</div><h2 data-reveal class=\"title\" style=\"margin-top:22px\">三樣東西，真的讓我少走很多冤枉路。</h2>\n  <div data-reveal class=\"grid-3\" style=\"margin-top:auto\"><div class=\"card cool\"><div class=\"num\">01</div><h3>真人導師</h3><p>哪怕只丟給我一個 repo，都能省下很多摸索。</p></div><div class=\"card hot\"><div class=\"num\">02</div><h3>AI 導師</h3><p>督導我，也督導其他 Agent，每天後設地三省吾身。</p></div><div class=\"card lime\"><div class=\"num\">03</div><h3>抽象地圖</h3><p>知道自己迷航在哪一步，也能把 Agent 一起撈回來。</p></div></div>\n  <div class=\"footer\"><span>有人指路</span><span>也要看得懂自己走到哪裡</span></div></div></section>","<section data-label=\"困難版分隔\"><div class=\"slide theme-violet\">\n  <div data-reveal class=\"eyebrow\">PHASE 02 · HARD MODE · 20 MIN</div><h2 data-reveal class=\"display\" style=\"font-size:112px;margin-top:auto\">看幾個真的<br>做下去的案例</h2><p data-reveal class=\"subtitle muted\" style=\"margin-top:30px\">每頁就是網站本身。點一下，直接進案例。</p>\n  <div class=\"footer\"><span>一個案例一頁</span><span>網頁可以直接點開</span></div></div></section>","<section data-label=\"Mesh 案例\"><div class=\"slide case-slide\">\n    <div data-reveal class=\"case-head\">< const findSlide=label=>slides.findIndex(slide=>slide.includes(`data-label="${label}"`));
const updateSlide=(label,transform)=>{
  const index=findSlide(label);
  if(index<0)throw new Error(`Missing slide: ${label}`);
  slides[index]=transform(slides[index]);
};
const replaceSlideText=(label,from,to)=>updateSlide(label,slide=>{
  if(!slide.includes(from))throw new Error(`Missing copy in slide: ${label}`);
  return slide.replace(from,to);
});
const moveSlideBefore=(label,beforeLabel)=>{
  const from=findSlide(label);
  if(from<0)throw new Error(`Missing slide: ${label}`);
  const [slide]=slides.splice(from,1);
  const to=findSlide(beforeLabel);
  if(to<0)throw new Error(`Missing slide: ${beforeLabel}`);
  slides.splice(to,0,slide);
};
const removeSlide=label=>{
  const index=findSlide(label);
  if(index<0)throw new Error(`Missing slide: ${label}`);
  slides.splice(index,1);
};

ne-height:1.42;\n    font-weight:500;\n  }\n\n  /* Hero blob shapes */\n  .blob{\n    position:absolute;\n    border-radius:50%;\n    filter:blur(0px);\n  }\n\n  /* ============================================================\n     MOTION SYSTEM — entry stagger + ambient accents.\n     Gated on `:host(.is-active)` (set by slidechange listener) so\n     animations only run on the visible slide. Reduced motion respected.\n     ============================================================ */\n  @media (prefers-reduced-motion: no-preference) {\n    @keyframes m-fade-up   { from{opacity:0;transform:translateY(36px);} to{opacity:1;transform:translateY(0);} }\n    @keyframes m-fade-down { from{opacity:0;transform:translateY(-22px);} to{opacity:1;transform:translateY(0);} }\n    @keyframes m-fade-in   { from{opacity:0;} to{opacity:1;} }\n    @keyframes m-slide-l   { from{opacity:0;transform:translateX(-70px);} to{opacity:1;transform:translateX(0);} }\n    @keyframes m-pop       { from{opacity:0;transform:scale(0.86);} to{opacity:1;transform:scale(1);} }\n    @keyframes m-pop-bounce{ 0%{opacity:0;transform:scale(0.7);} 65%{opacity:1;transform:scale(1.06);} 100%{transform:scale(1);} }\n    @keyframes m-pulse     { 0%,100%{transform:scale(1);} 50%{transform:scale(1.035);} }\n    @keyframes m-breathe   { 0%,100%{box-shadow:0 0 0 0 rgba(255,45,135,0);} 50%{box-shadow:0 0 0 22px rgba(255,45,135,0.18);} }\n    @keyframes m-arrow-pulse { 0%,100%{transform:translateX(0);} 50%{transform:translateX(14px);} }\n    @keyframes m-drift-a   { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(60px,-40px) scale(1.06);} }\n    @keyframes m-drift-b   { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-50px,30px) scale(0.94);} }\n    @keyframes m-drift-c   { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }\n    @keyframes m-shimmer   { 0%,100%{opacity:0.85;} 50%{opacity:0.32;} }\n    @keyframes m-rotate    { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }\n    @keyframes m-flow-marquee { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }\n\n    /* Universal entry — eyebrow drops in, then title rises, then body */\n    :host(.is-active) .eyebrow { animation: m-fade-down 0.5s ease-out 0.05s backwards; }\n    :host(.is-active) .title-xl,\n    :host(.is-active) .title-lg,\n    :host(.is-active) .title { animation: m-fade-up 0.7s cubic-bezier(0.2,0.7,0.2,1) 0.18s backwards; }\n    :host(.is-active) .subtitle { animation: m-fade-up 0.6s cubic-bezier(0.2,0.7,0.2,1) 0.28s backwards; }\n\n    /* Cards / grid items pop in with stagger inside the active slide */\n    :host(.is-active) .grid-2 > *,\n    :host(.is-active) .grid-3 > * {\n      animation: m-pop 0.55s cubic-bezier(0.2,0.7,0.2,1) backwards;\n    }\n    :host(.is-active) .grid-2 > *:nth-child(1), :host(.is-active) .grid-3 > *:nth-child(1) { animation-delay: 0.40s; }\n    :host(.is-active) .grid-2 > *:nth-child(2), :host(.is-active) .grid-3 > *:nth-child(2) { animation-delay: 0.50s; }\n    :host(.is-active) .grid-2 > *:nth-child(3), :host(.is-active) .grid-3 > *:nth-child(3) { animation-delay: 0.60s; }\n    :host(.is-active) .grid-2 > *:nth-child(4), :host(.is-active) .grid-3 > *:nth-child(4) { animation-delay: 0.70s; }\n\n    /* Hover lift on cards — subtle, stops feeling static during talk */\n    .card, .lift { transition: transform 0.4s cubic-bezier(0.2,0.7,0.2,1), box-shadow 0.4s; will-change: transform; }\n    .card:hover, .lift:hover { transform: translateY(-8px); box-shadow: 0 18px 40px -16px rgba(0,0,0,0.25); }\n\n    /* Title slide (1) + closing slide (20): blobs drift while active */\n    :host(.is-active) .blob-a { animation: m-drift-a 14s ease-in-out infinite; }\n    :host(.is-active) .blob-b { animation: m-drift-b 11s ease-in-out infinite 0.6s; }\n    :host(.is-active) .blob-c { animation: m-drift-c 9s  ease-in-out infinite 1.1s; }\n\n    /* Slide 5 — rule-of-thumb callout breathes f-type(3) { animation-delay: 0.80s; }\n    :host(.is-active) .chain-node:nth-of-type(4) { animation-delay: 1.05s; }\n    :host(.is-active) .chain-node:nth-of-type(5) { animation-delay: 1.30s; }\n    :host(.is-active) .chain-arrow { animation: m-fade-in 0.4s ease-out backwards; }\n    :host(.is-active) .chain-arrow:nth-of-type(1) { animation-delay: 0.45s; }\n    :host(.is-active) .chain-arrow:nth-of-type(2) { animation-delay: 0.70s; }\n    :host(.is-active) .chain-arrow:nth-of-type(3) { animation-delay: 0.95s; }\n    :host(.is-active) .chain-arrow:nth-of-type(4) { animation-delay: 1.20s; }\n\n    /* Slide 16 — \"提問 / 執行 / 發布 / 調校\" cycle: sun ring slowly orbits behind */\n    :host(.is-active) .cycle-orbit { animation: m-rotate 22s linear infinite; }\n\n    /* Slide 17 — questions stagger in like they're being asked one by one */\n    :host(.is-active) .q-item { animation: m-fade-up 0.55s cubic-bezier(0.2,0.7,0.2,1) backwards; }\n    :host(.is-active) .q-item:nth-of-type(1) { animation-delay: 0.30s; }\n    :host(.is-active) .q-item:nth-of-type(2) { animation-delay: 0.45s; }\n    :host(.is-active) .q-item:nth-of-type(3) { animation-delay: 0.60s; }\n    :host(.is-active) .q-item:nth-of-type(4) { animation-delay: 0.75s; }\n  }\n\n";
document.querySelectorAll('section.legacy-clab').forEach(section=>{
  const template=section.querySelector('template.legacy-clab-template');
  const root=section.attachShadow({mode:'open'});
  const style=document.createElement('style');
  style.textContent=legacyCss;
  root.append(style,template.content.cloneNode(true));
  template.remove();

<script src="gsap.min.js"></script>
<script src="/decks/c-lab-0610/deck-stage.js"></script>
<script>
const fitDeckToPane=()=>{
  const stage=document.querySelector('deck-stage');
  const canvas=stage?.shadowRoot?.querySelector('.canvas');
  if(!stage||!canvas)return;
  const rect=stage.getBoundingClientRect();
  canvas.style.transform=`scale(${Math.min(rect.width/1920,rect.height/1080)})`;
};
const splitStage=document.querySelector('deck-stage');
splitStage._fit=fitDeckToPane;
fitDeckToPane();
requestAnimationFrame(fitDeckToPane);
new ResizeObserver(fitDeckToPane).observe(splitStage);
window.addEventListener('resize',()=>requestAnimationFrame(fitDeckToPane));
const dashboardToggle=document.querySelector('.dashboard-toggle');
const dashboardCollapse=document.querySelector('.dashboard-collapse');
const dashboardScrim=document.querySelector('.dashboard-scrim');
const dashboardClose=document.querySelector('.dashboard-drawer-bar button');
const isCompactDashboard=()=>window.matchMedia('(max-width:1366px)').matches;
const setDashboardCollapsed=collapsed=>{
  document.body.classList.toggle('dashboard-collapsed',collapsed&&!isCompactDashboard());
  requestAnimationFrame(fitDeckToPane);
};
const setDashboardDrawer=open=>{
  document.body.classList.toggle('dashboard-drawer-open',open);
  dashboardToggle?.setAttribute('aria-expanded',String(open));
  if(open)document.querySelector('.dashboard-pane iframe')?.focus();
  else dashboardToggle?.focus();
};
dashboardToggle?.addEventListener('click',()=>{
  if(isCompactDashboard())setDashboardDrawer(true);
  else setDashboardCollapsed(false);
});
dashboardCollapse?.addEventListener('click',()=>setDashboardCollapsed(true));
dashboardScrim?.addEventListener('click',()=>setDashboardDrawer(false));
dashboardClose?.addEventListener('click',()=>setDashboardDrawer(false));
window.addEventListener('resize',()=>{
  if(isCompactDashboard())setDashboardCollapsed(false);
});
window.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&document.body.classList.contains('dashboard-drawer-open')){
    event.preventDefault();
    setDashboardDrawer(false);
  }
});
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.data?.type!=='clinical-ai-deck-key')return;
  const stage=document.querySelector('deck-stage');
  if(!stage)return;
  const key=event.data.key;
  if(key==='ArrowRight'||key==='PageDown'||key===' ')stage.next();
  if(key==='ArrowLeft'||key==='PageUp')stage.prev();
  if(key==='Home')stage.goTo(0);
  if(key==='End')stage.goTo(stage.length-1);
});
</script>
<script>
(()=>{
  const stage=document.querySelector('deck-stage');
  if(!stage)return;
  const apply=slide=>{
    stage.querySelectorAll('section.is-active').forEach(item=>item.classList.remove('is-active'));
    if(!slide)return;
    void slide.offsetWidth;
    slide.classList.add('is-active');
  };
  stage.addEventListener('slidechange',event=>apply(event.detail.slide));
  requestAnimationFrame(()=>apply(stage.querySelector('section[data-deck-active]')||stage.querySelector('section')));
})();
</script>
<script>
(()=>{
  const stage=document.querySelector('deck-stage');
  if(!stage||!window.gsap)return;
  let activeTimeline=null;
  const mm=gsap.matchMedia();
  mm.add({reduceMotion:'(prefers-reduced-motion: reduce)',fullMotion:'(prefers-reduced-motion: no-preference)'},context=>{
    const reduceMotion=context.conditions.reduceMotion;
    const animate=slide=>{
      if(slide?.classList.contains('legacy-clab'))return;
      if(!slide)return;
      activeTimeline?.kill();
      const all=[...slide.querySelectorAll('[data-reveal]')];
      const heads=all.filter(item=>item.matches('h1,h2,.display,.title,.title-lg'));
      const support=all.filter(item=>!heads.includes(item)&&!item.matches('.qr-box'));
      const cards=[...slide.querySelectorAll('.card,.step,.node,.role')];
      const shapes=[...slide.querySelectorAll('.ghost-orbit')];
      const screenshot=slide.querySelector('.case-shot img');
      if(reduceMotion){
        gsap.set([slide,...all,...cards,...shapes,screenshot].filter(Boolean),{autoAlpha:1,x:0,y:0,scale:1,rotation:0,clearProps:'transform,visibility,opacity'});
        return;
      }
      gsap.set(slide,{scale:1.012,transformOrigin:'50% 50%'});
      if(heads.length)gsap.set(heads,{autoAlpha:0,y:64});
      if(support.length)gsap.set(support,{autoAlpha:0,y:34});
      if(cards.length)gsap.set(cards,{autoAlpha:0,y:48,rotation:.5});
      if(shapes.length)gsap.set(shapes,{scale:.78,autoAlpha:0,transformOrigin:'50% 50%'});
      if(screenshot)gsap.set(screenshot,{scale:1.06,autoAlpha:0});
      activeTimeline=gsap.timeline({defaults:{duration:.68,ease:'power3.out',overwrite:'auto'}});
      activeTimeline.addLabel('open',0).to(slide,{scale:1,duration:.95},'open');
      if(shapes.length)activeTimeline.to(shapes,{scale:1,autoAlpha:1,duration:1.05,stagger:.12},'open');
      if(screenshot)activeTimeline.to(screenshot,{scale:1,autoAlpha:1,duration:1.15},'open');
      if(heads.length)activeTimeline.to(heads,{autoAlpha:1,y:0,duration:.82,stagger:.09},'open+=.08');
      if(support.length)activeTimeline.to(support,{autoAlpha:1,y:0,stagger:.075},'open+=.18');
      if(cards.length)activeTimeline.to(cards,{autoAlpha:1,y:0,rotation:0,stagger:.065},'open+=.28');
    };
    const onChange=event=>animate(event.detail.slide);
    stage.addEventListener('slidechange',onChange);
    requestAnimationFrame(()=>animate(stage.querySelector('[data-deck-active]')||stage.querySelector('section')));
    return()=>{stage.removeEventListener('slidechange',onChange);activeTimeline?.kill()};
  });
})();
</script>
