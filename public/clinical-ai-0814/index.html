<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081225" />
    <title>8/14 臨床工作者 AI Agent 現場互動</title>
    <link rel="stylesheet" href="/clinical-ai-0814/style.css" />
  </head>
  <body>
    <header class="hero">
      <div class="eyebrow">8/14 · CLINICAL AI AGENT</div>
      <h1>現場投票<br />隨時提問</h1>
      <p>四題快速投票，提問區全程開放。每一題都會留下，整理時可合併相近問題，但不會刪掉原題。</p>
      <div class="live-status" data-status><span></span>連線中</div>
    </header>
    <main>
      <nav class="tabs" aria-label="互動功能">
        <button class="active" data-tab="polls">快速投票</button>
        <button data-tab="questions">隨時提問</button>
      </nav>
      <section data-panel="polls" class="panel active">
        <div id="polls" class="poll-grid" aria-live="polite"></div>
      </section>
      <section data-panel="questions" class="panel">
        <form id="question-form" class="ask-card">
          <div class="form-step">
            <span>01</span>
            <div><b>先寫下問題</b><small>一句話就好，想到時隨時送出</small></div>
          </div>
          <label class="sr-only" for="question">你的問題</label>
          <textarea
            id="question"
            name="question"
            minlength="4"
            maxlength="280"
            required
            placeholder="例如：值班後只剩二十分鐘，我該從哪一個工作流開始？"
          ></textarea>

          <fieldset class="intent-fieldset">
            <legend class="form-step">
              <span>02</span>
              <div><b>你希望大家怎麼接這一題？</b><small>選最接近的用途，方便 Q&A 整理</small></div>
            </legend>
            <div class="intent-grid">
              <label class="intent-option">
                <input type="radio" name="lens" value="clarify" checked />
                <span><b>幫我釐清</b><small>我還不熟，想先把概念或做法弄懂</small></span>
              </label>
              <label class="intent-option">
                <input type="radio" name="lens" value="chorus" />
                <span><b>我也遇到了</b><small>想知道現場是否有人有同樣困擾</small></span>
              </label>
              <label class="intent-option">
                <input type="radio" name="lens" value="bridge" />
                <span><b>一起拆兩難</b><small>兩個方向都有代價，想把取捨攤開</small></span>
              </label>
              <label class="intent-option">
                <input type="radio" name="lens" value="keeper" />
                <span><b>別漏掉這點</b><small>有一個條件、風險或現場限制要補上</small></span>
              </label>
            </div>
          </fieldset>

          <div class="form-step compact">
            <span>03</span>
            <div><b>留下稱呼</b><small>選填，也可以保持匿名</small></div>
          </div>
          <label class="sr-only" for="nickname">稱呼</label>
          <input
            id="nickname"
            name="nickname"
            maxlength="24"
            placeholder="例如：內科 R1、護理師、匿名"
            autocomplete="nickname"
          />
          <div class="form-note">每台裝置最多提出三題。相近問題可以合併討論，原題仍會保留。</div>
          <button class="primary" type="submit">送出問題</button>
          <div class="form-message" data-form-message aria-live="polite"></div>
        </form>
        <div class="section-head">
          <div>
            <div class="eyebrow">QUESTION POOL</div>
            <h2>大家想問的事</h2>
          </div>
          <span data-question-count>0 題</span>
        </div>
        <div id="questions" class="question-list" aria-live="polite"></div>
      </section>
    </main>
    <footer>
      <a href="https://mashbean.net/decks/clinical-ai-agent-0814/">回到簡報</a>
      <a href="https://github.com/htlin222/kahoot-cf">即時互動參考 · htlin222/kahoot-cf</a>
      <a href="https://github.com/audreyt/uncommon-ground"
        >問題閉環參考 · audreyt/uncommon-ground</a
      >
    </footer>
    <script type="module" src="/clinical-ai-0814/app.js"></script>
  </body>
</html>
