<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081225" />
    <title>臨床工作者 AI Agent 現場儀表板</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <header class="dashboard-header">
      <div>
        <div class="eyebrow">LIVE · 8/14</div>
        <h1>臨床工作者 AI Agent<br />現場互動</h1>
      </div>
      <div class="live-status" data-status><span></span>連線中</div>
    </header>
    <main class="dashboard-main">
      <section class="dashboard-section dashboard-difficulty difficulty-card">
        <div class="dashboard-section-head">
          <div>
            <div class="eyebrow">DIFFICULTY</div>
            <h2>即時難易度</h2>
          </div>
          <span data-difficulty-total>等待回報</span>
        </div>
        <div class="difficulty-chart" aria-label="現場難易度分布" role="img">
          <svg viewBox="0 0 600 210" preserveAspectRatio="none" aria-hidden="true">
            <path class="difficulty-grid-line" d="M20 170 H580" />
            <path data-difficulty-area class="difficulty-area" />
            <path data-difficulty-line class="difficulty-line" />
            <g data-difficulty-points></g>
          </svg>
          <div class="difficulty-counts" data-difficulty-counts></div>
        </div>
      </section>

      <section class="dashboard-section">
        <div class="dashboard-section-head">
          <div>
            <div class="eyebrow">POLL</div>
            <h2>投票結果</h2>
          </div>
        </div>
        <div id="dashboard-polls" class="dashboard-polls"></div>
      </section>

      <section class="dashboard-section">
        <div class="dashboard-section-head">
          <div>
            <div class="eyebrow">Q&A POOL</div>
            <h2>隨時提問</h2>
          </div>
          <span data-question-count>0 題</span>
        </div>
        <div id="dashboard-questions" class="dashboard-questions"></div>
      </section>
    </main>
    <a class="dashboard-open" href="/" target="_blank" rel="noreferrer">開啟參與頁 ↗</a>
    <script type="module" src="/dashboard/dashboard.js"></script>
  </body>
</html>
