name: Deploy Astro to GitHub Pages (User/Org)

# RETIRED: mashbean.net is served by Cloudflare (Workers) via Git integration.
# This workflow no longer auto-deploys on push — kept as a manual-only fallback
# in case we ever need to bring GitHub Pages back. Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-user-org-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: "https://mashbean.net"
      BASE_PATH: "/"
      PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
      PUBLIC_PLAUSIBLE_SCRIPT_SRC: ${{ vars.PUBLIC_PLAUSIBLE_SCRIPT_SRC }}
      PUBLIC_TIP_ENS_NAME: "mashbean.eth"
      PUBLIC_TIP_ADDRESS: ${{ vars.PUBLIC_TIP_ADDRESS || '0xab51AD23d222fD0afB4e29F3244402af9aa3C420' }}
      PUBLIC_SIGNER_ENS_NAME: ${{ vars.PUBLIC_SIGNER_ENS_NAME }}
      PUBLIC_WEB3_CHAIN_ID: "1"
      PUBLIC_WEB3_RPC_URL: "https://ethereum.publicnode.com"
      # Render pages in parallel to overlap per-page latency on the 2-core
      # runner. Lower this if the build OOMs or slows down.
      BUILD_CONCURRENCY: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Persist Astro's content/render cache across runs. With restore-keys the
      # previous cache is reused even when content changed, so only changed
      # posts re-render instead of all ~1,200 pages — the practical "only
      # rebuild what changed" win. Restored AFTER npm ci because that wipes
      # node_modules (where node_modules/.astro lives).
      - name: Restore Astro build cache
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.astro
            node_modules/.vite
          key: astro-cache-${{ runner.os }}-${{ hashFiles('src/content/**', 'src/**/*.astro', 'astro.config.ts') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      - name: Verify post signatures
        continue-on-error: true
        run: npm run sign:posts:check

      - name: Check cover image sizes
        run: npm run check:covers

      - name: Build Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
